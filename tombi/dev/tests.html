<body>
  <h1>בדיקות אות סינתטיות</h1>
  <p id="summary">מריץ…</p>
  <ol id="results"></ol>
  <pre id="details"></pre>
  <script src="../js/dsp.js"></script>

  <script src="../js/tasks/activity-support.js"></script>
  <script src="../js/tasks/stomp-freeze.js"></script>

  <script src="../js/tasks/march.js"></script>
  <script src="../js/tasks/ot-engine.js"></script>
  <script src="../js/tasks/crystal-tower.js"></script>
  <script src="../js/tasks/calming-potion.js"></script>
  <script src="../js/tasks/emotion-guess.js"></script>
  <script src="../js/planner.js"></script>
  <script src="../js/pdf.js?v=20261025-native-print"></script>
  <script src="../js/report.js?v=20261025-data-pdf-2"></script>
  <script>
    const tests = [];
    const asyncTests = [];
    const test = (name, run) => {
      try { const detail = run(); tests.push({ name, pass: detail !== false, detail }); }
      catch (error) { tests.push({ name, pass: false, detail: error.message }); }
    };
    const testAsync = (name, run) => {
      asyncTests.push((async () => {
        try {
          const detail = await run();
          tests.push({ name, pass: detail !== false, detail });
        } catch (error) {
          tests.push({ name, pass: false, detail: error.message });
        }
      })());
    };
    const samples = new Float32Array(512);
    for (let i = 0; i < samples.length; i++) samples[i] = Math.sin(2 * Math.PI * 100 * i / 16000);
    function impact(frequency, decaySeconds) {
      const signal = new Float32Array(6400);
      for (let i = 0; i < signal.length; i++) {
        signal[i] = 0.7 * Math.sin(2 * Math.PI * frequency * i / 16000) * Math.exp(-i / (16000 * decaySeconds));
      }
      return signal;
    }
    test('עשרת פסי התדר מחזירים ערכים סופיים', () => {
      const bands = T.dsp.onsetBands(samples, 16000);
      return bands.length === 10 && bands.every(Number.isFinite) ? `bands=${bands.length}` : false;
    });
    test('שטף חיובי מזהה עלייה בספקטרום', () => T.dsp.onsetFlux(new Array(10).fill(2), new Array(10).fill(1)) > 0);
    test('סף אדפטיבי נשאר סופי', () => Number.isFinite(T.dsp.adaptiveOnsetThreshold([0, 1, 0, 1, 0])));
    test('מאפייני אות סינתטי מבדילים בין רקיעה למחיאה', () => {
      const stomp = T.dsp.onsetFeatures(impact(75, 0.04));
      const clap = T.dsp.onsetFeatures(impact(1800, 0.018));
      return T.dsp.classifyOnset(stomp).cls === 'stomp' && T.dsp.classifyOnset(clap).cls === 'clap';
    });
    test('מאפיין שריקה מזהה אנרגיה בתחום 4–8 קה״ץ', () => {
      const hiss = Float32Array.from({ length: 6400 }, (_, i) => Math.sin(2 * Math.PI * 5000 * i / 16000));
      const features = T.dsp.sibilanceFeatures(hiss);
      return features.highBandRatio > 0.5 && features.zcr > 0.1 && features.f0Hz === 0;
    });
    test('קול הרמוני אינו מסווג כשריקה', () => {
      const voice = Float32Array.from({ length: 6400 }, (_, i) => Math.sin(2 * Math.PI * 300 * i / 16000));
      const features = T.dsp.sibilanceFeatures(voice);
      return features.f0Hz > 250;
    });
    test('נרמול מאפיינים מוגבל ל־0..1', () => {
      const v = T.dsp.normalizeOnsetFeatures({ lowBandRatio: 2, centroidHz: 9000, zcr: .2, harmonicity: .5, decayMs: 200, durationMs: 100 });
      return v.length === 6 && v.every((x) => x >= 0 && x <= 1);
    });
    test('בחירת שיאים אוכפת מרווח מינימלי בין onsets', () => {
      const frames = Array.from({ length: 50 }, (_, i) => ({ t: i * 10, db: -30, odf: 0 }));
      frames[12].odf = 10; frames[22].odf = 9;
      return T.dsp.peakPick(frames, { floorDb: -60, minAboveFloor: 10, minIoiMs: 130 }).length === 1;
    });
    testAsync('איסוף אירועים שומר הקפאת רצפה פעילה', async () => {
      const wasFrozen = T.audio.floorFrozen;
      const originalUi = T.ui;
      T.audio.setOnsetConfig({ floorFrozen: true });
      T.ui = { onsetRepeat() {} };
      try {
        await T.activity.collect({ wait: async () => {} }, { durationMs: 0, drainMs: 0 });
        return T.audio.floorFrozen;
      } finally {
        T.audio.setOnsetConfig({ floorFrozen: wasFrozen });
        T.ui = originalUi;
      }
    });
    test('שיא מתחת לסף רעש אינו נבחר', () => {
      const frames = Array.from({ length: 40 }, (_, i) => ({ t: i * 10, db: -55, odf: i === 20 ? 20 : 0 }));
      return T.dsp.peakPick(frames, { floorDb: -60, minAboveFloor: 10 }).length === 0;
    });
    test('שומר סף retrigger מתעלם מהד חלש ומקבל onset חזק', () =>
      !T.dsp.acceptOnset(1050, -55, 1000, -30, 0, 150)
      && T.dsp.acceptOnset(1150, -20, 1000, -30, 130, 150));
    test('סיווג אירוע קרוב לשני צנטרואידים מסומן לא ודאי', () => {
      const f = { lowBandRatio: .4, centroidHz: 1000, zcr: .1, harmonicity: .2, decayMs: 80, durationMs: 80 };
      const vector = T.dsp.normalizeOnsetFeatures(f);
      const close = vector.map((x) => x + .001), other = vector.map((x) => x + .001);
      return T.dsp.classifyOnset(f, { stomp: close, clap: other }).cls === 'uncertain';
    });
    test('מיזוג נחיתות שומר אירועים נפרדים', () => {
      const merged = T.dsp.mergeLandings([{ t: 10, peakDb: -20 }, { t: 40, peakDb: -18 }, { t: 240, peakDb: -25 }]);
      return merged.length === 2 && merged[0].members === 2;
    });
    test('זיהוי כדור נופל לפי האצה מדורגת', () => T.dsp.ballFell([{ t: 0 }, { t: 500 }, { t: 850 }]));
    test('חלון שערה פועל על שעון האודיו', () => T.dsp.isTimeGated(120, [[100, 140]]) && !T.dsp.isTimeGated(150, [[100, 140]]));
    test('תבנית מטרה מתקשרת למשימות חוקיות', () => {
      const goal = T.goals.normalize({ template: 'rhythm', target: 80 });
      return goal.metric === 'score' && goal.taskKeys.includes('echo') && goal.target === 80;
    });
    test('מטרה דוחה יעד מחוץ לטווח', () => {
      try { T.goals.normalize({ template: 'rhythm', target: 120 }); return false; }
      catch (error) { return error instanceof RangeError; }
    });
    test('ראיות עם ביטחון נמוך אינן נכללות במגמה', () => {
      const child = { id: 'test-child' };
      const goal = T.goals.normalize({ template: 'inhibition', target: 80, baseline: 40 });
      const sessions = [0.9, 0.4, 0.8].map((confidence, index) => ({
        childId: child.id, date: index + 1, stages: { magic: { score: 50 + index * 10, confidence } }, assists: [],
      }));
      const result = T.goals.evaluate(child, goal, sessions);
      return result.rows.length === 3 && result.validCount === 2 && result.recentCount === 2 && result.review;
    });
    test('הערכת מטרה משקפת מגמה, תמיכה והגעה ליעד רק לאחר שתי מדידות', () => {
      const child = { id: 'test-child' };
      const goal = T.goals.normalize({ template: 'rhythm', target: 70, baseline: 40 });
      const sessions = [70, 74, 80].map((score, index) => ({
        childId: child.id, date: index + 1, stages: { echo: { score, confidence: 0.9 } },
        assists: index === 0 ? [{ stage: 'echo', type: 'verbal' }] : [],
      }));
      const result = T.goals.evaluate(child, goal, sessions);
      return result.targetReached && result.validCount === 3 && result.assistRate > 0 && result.direction === 1;
    });
    test('רשומות הדגמה אינן הופכות לראיות של ילד אמיתי', () => {
      const session = { childId: 'test-child', date: 1, sample: true, stages: { echo: { score: 80 } } };
      const goal = T.goals.normalize({ template: 'rhythm', target: 80 });
      const real = T.goals.evaluate({ id: 'test-child' }, goal, [session]);
      const demo = T.goals.evaluate({ id: 'test-child', demo: true }, goal, [session]);
      return real.validCount === 0 && demo.validCount === 1;
    });
    test('ראיות ממספר משימות באותו מפגש נספרות כמפגש אחד', () => {
      const child = { id: 'test-child' };
      const goal = T.goals.normalize({ template: 'rhythm', target: 80 });
      const sessions = [1, 2].map((date) => ({
        childId: child.id, date,
        stages: { echo: { score: 60 + date, confidence: 0.9 }, march: { score: 70 + date, confidence: 0.8 } },
      }));
      const result = T.goals.evaluate(child, goal, sessions);
      return result.rows.length === 2 && result.validCount === 2 && Math.round(result.first) === 66;
    });
    test('תוכנית מעדיפה לקשר משימה למטרה מאושרת ושומרת הסבר', () => {
      const goal = T.goals.normalize({ template: 'rhythm', target: 80, approved: true, approvedBy: 'בדיקה' });
      const child = { id: 'planner-child', age: 5, goals: [goal] };
      const plan = T.planner.build(child, { budgetMin: 12 }, [], { date: '2026-10-24' });
      const linked = plan.tasks.find((entry) => entry.goalIds.includes(goal.id));
      return !!linked && linked.reason.includes(goal.title) && plan.goals.length === 1;
    });
    test('תוכנית אינה משתמשת במטרה שטרם אושרה', () => {
      const goal = T.goals.normalize({ template: 'rhythm', target: 80, approved: false });
      const child = { id: 'planner-child', age: 5, goals: [goal] };
      const plan = T.planner.build(child, { budgetMin: 12 }, [], { date: '2026-10-24' });
      return plan.goals.length === 0 && plan.tasks.every((entry) => !entry.goalIds.includes(goal.id));
    });
    test('החלפת משימה ידנית שומרת על מגבלת קפיצה אחת', () => {
      const child = { id: 'planner-child', age: 5, canJump: true, canStand: true };
      const setting = { room: 'clinic', hardFloor: true, freeSpace: true, pot: true, ball: true, quietRoom: true };
      const plan = [
        { key: 'jumps', slot: 'arousal' },
        { key: 'magic', slot: 'inhibition' },
        { key: 'jumps', slot: 'arousal' },
      ];
      const history = [{ childId: child.id, mode: 'mic', stages: { jumps: { score: 70 } } }];
      const unsafe = T.planner.canReplace(plan, 2, 'jumps', child, setting, history);
      const safe = T.planner.canReplace(plan, 2, 'stompFreeze', child, setting, history);
      return !unsafe && safe;
    });
    test('משימה ששוחקה לפחות פעם אחת באחד משלושת המפגשים האחרונים אינה due', () => {
      const recent = [
        { stages: { march: { score: 70 } } },
        { stages: { echo: { score: 70 } } },
        { stages: { march: { skipped: true } } },
      ];
      return T.planner.wasPlayedRecently('march', recent)
        && !T.planner.wasPlayedRecently('clapStomp', recent);
    });
    test('התוכנית עומדת בתקציבי 6, 9 ו־12 דקות ומסמנת משימות חובה', () => {
      const child = { id: 'planner-budget-child', age: 5, canJump: true, canStand: true };
      return [6, 9, 12].every((budgetMin) => {
        const plan = T.planner.build(child, { budgetMin }, [], { date: '2026-10-24' });
        const active = plan.tasks.filter((entry) => !entry.skip);
        return plan.estimatedSec === T.planner.estimate(plan.tasks)
          && plan.estimatedSec <= budgetMin * 60
          && ['wakeUp', 'engineStart', 'turtleRabbit', 'snake', 'engineEnd']
            .every((key) => plan.tasks.some((entry) => entry.key === key && entry.mandatory))
          && active.filter((entry) => T.planner.isNewTask(entry.key, child, [])).length <= 1
          && active.filter((entry) => T.tasks.get(entry.key).jump).length <= 1
          && !active.some((entry, index) => {
            if (!index || child.canStand === false) return false;
            const previous = T.tasks.get(active[index - 1].key);
            const task = T.tasks.get(entry.key);
            return previous.gross && previous.needs.standing && task.gross && task.needs.standing;
          })
          && T.tasks.all().every((task) => Math.max(task.durationSec.full, task.durationSec.short) <= 120);
      });
    });
    test('בדיקות התחושה הן דיווח עצמי, עם נשימות דרקון שהילד בוחר', () => {
      const start = T.tasks.get('engineStart'), end = T.tasks.get('engineEnd');
      const simulated = start.simulate({ feeling: 'worried', breaths: 3 });
      return Object.keys(T.FEELINGS).join(',') === 'happy,calm,tired,sad,worried,angry,unsure,preferNot'
        && start.durationSec.full === 30
        && simulated.feeling === 'worried' && simulated.breaths === 3
        && end.simulate({ feeling: 'calm' }).feeling === 'calm'
        && !['turtle', 'fish', 'monkey'].some((key) => key in T.FEELINGS);
    });
    test('גן מסנן כדור ומנהרת לחישה, אך מאפשר שלב קול בסיסי', () => {
      const child = { id: 'planner-kindergarten-child', age: 5, levels: { loudness: 3 } };
      const setting = { room: 'kindergarten', quietRoom: false, budgetMin: 9 };
      const plan = T.planner.build(child, setting, [], { date: '2026-10-24' });
      return !T.planner.eligible(T.tasks.get('ball'), child, setting)
        && !T.planner.eligible(T.tasks.get('loudness'), child, setting)
        && plan.tasks.every((entry) => !['ball', 'loudness'].includes(entry.key));
    });
    test('החלפה ידנית אינה יכולה ליצור שתי משימות חדשות או רצף תנועה בעמידה', () => {
      const child = { id: 'planner-replace-child', age: 5, canJump: true, canStand: true };
      const setting = { hardFloor: true, freeSpace: true, pot: true, ball: true, quietRoom: true, room: 'clinic' };
      const history = [{ childId: child.id, mode: 'mic', stages: { stompFreeze: { score: 75 } } }];
      const grossPlan = [
        { key: 'echo', slot: 'rhythm' },
        { key: 'stompFreeze', slot: 'arousal' },
      ];
      const twoNewTasks = [
        { key: 'march', slot: 'rhythm' },
        { key: 'stompFreeze', slot: 'arousal' },
      ];
      return !T.planner.canReplace(grossPlan, 0, 'march', child, setting, history)
        && !T.planner.canReplace(twoNewTasks, 1, 'jumps', child, setting, []);
    });
    test('לכל אחת מתשע המשימות החדשות יש פרמטרים חוקיים בכל חמש הרמות', () => {
      const keys = ['stompFreeze', 'jumps', 'reverseDrum', 'turtleRabbit', 'clapStomp', 'ball', 'elephantMouse', 'march', 'snake'];
      const child = { id: 'level-child', age: 5, canStand: false, canJump: false };
      return keys.every((key) => {
        const task = T.tasks.get(key);
        return typeof task.simulate === 'function'
          && [1, 2, 3, 4, 5].every((level) => {
            const params = task.params(level, child.age, child);
            return Number(params.level) === level && Object.values(params).every((value) => value !== undefined);
          });
      });
    });
    test('סולם מילת הקסם שומר יחס 75:25 ומחליף כלל רק ברמה 5', () => {
      const child = { age: 5 };
      const levels = [1, 2, 3, 4, 5].map((level) => T.levels.params('magic', level, child));
      const ratios = levels.every((params) => params.items.filter((item) => item.go).length === 9
        && params.items.filter((item) => !item.go).length === 3);
      return ratios
        && levels[0].items.filter((item) => !item.go).every((item) => item.word === 'צפרדע' && item.voice === 'sleepy')
        && levels[2].items.filter((item) => item.go).every((item) => item.sound === 'bell')
        && levels[3].irregular && levels[4].ruleSwitch
        && levels[4].items.filter((item) => item.go).every((item) => item.sound === (item.rule === 'star' ? 'bell' : 'drum'));
    });
    test('רמות הנחש והמצעד מותאמות גיל ומפעילות עצירה ואנטי-פאזה בזמן המתאים', () => {
      const young = { age: 4, canStand: true };
      const older = { age: 5, canStand: true };
      const snake1 = T.tasks.get('snake').params(1, young.age, young);
      const snake4 = T.tasks.get('snake').params(4, young.age, young);
      const march4 = T.tasks.get('march').params(4, older.age, older);
      const march5 = T.tasks.get('march').params(5, older.age, older);
      const marchYoung5 = T.tasks.get('march').params(5, young.age, young);
      return snake1.mode === 'capacity' && snake1.targetSeconds === 5
        && snake4.mode === 'stop-cue' && march4.tempoShiftMs >= 50
        && march5.antiPhase && !marchYoung5.antiPhase;
    });
    test('סולם התוף ההפוך מודד חיקוי, היפוך, רמזים וקצב לפי הרמה', () => {
      const levels = [1, 2, 3, 4, 5].map((level) => T.tasks.get('reverseDrum').params(level, 5, { age: 5 }));
      return levels[0].items === 16 && !levels[0].invert
        && levels[1].invert && levels[1].visualCue && levels[1].responseWindowMs === 2500
        && levels[2].invert && !levels[2].visualCue
        && levels[3].intervalMs === 2400 && levels[3].responseWindowMs === 2000
        && levels[4].irregular && levels[4].trialIntervals.some((ms, index, all) => index > 0 && ms !== all[index - 1]);
    });
    test('ניקוד התוף ההפוך מתעלם משני פריטי החיקוי וסופר 14 פריטי היפוך', () => {
      const task = T.tasks.get('reverseDrum');
      const params = task.params(2, 6, { age: 6 });
      const trials = task.trials(params, 16);
      const events = trials.flatMap((trial) => Array.from({ length: trial.targetCount }, (_, index) => ({
        t: 1000 + trial.responseStartMs + 200 + index * 260,
      })));
      const results = task.scoreEvents(events, trials, 1000);
      const scored = results.filter((item) => item.scored);
      const imitationEvents = trials.filter((trial) => trial.scored).flatMap((trial) =>
        Array.from({ length: trial.modelCount }, (_, index) => ({
          t: 1000 + trial.responseStartMs + 200 + index * 260,
        })));
      const imitationResults = task.scoreEvents(imitationEvents, trials, 1000).filter((item) => item.scored);
      const noResponseResults = task.scoreEvents([], trials, 1000).filter((item) => item.scored);
      const noOverlap = [4, 5].every((level) => {
        const advanced = task.trials(task.params(level, 6, { age: 6 }), 16);
        return advanced.every((trial, index) => index === advanced.length - 1
          || trial.responseEndMs <= advanced[index + 1].startMs);
      });
      const originalClap = T.audio.sim.clap;
      const simulated = [];
      const simulationParams = [params, ...[4, 5].map((level) => ({
        ...task.params(level, 6, { age: 6 }), items: 16,
      }))];
      T.audio.sim.clap = (delay) => simulated.push(delay);
      try { simulationParams.forEach((simulation) => task.simulate(simulation)); }
      finally { T.audio.sim.clap = originalClap; }
      const expectedSimulation = simulationParams.flatMap((simulation) =>
        task.trials(simulation, simulation.items).flatMap((trial) =>
          Array.from({ length: trial.targetCount }, (_, index) =>
            trial.startMs + (trial.modelCount - 1) * 160 + 350 + index * 260)));
      return results.slice(0, 2).every((item) => !item.scored && item.correct)
        && scored.length === 14 && scored.every((item) => item.correct)
        && imitationResults.every((item) => item.count === item.target && !item.correct)
        && noResponseResults.every((item) => item.count === 0 && !item.correct)
        && noOverlap && JSON.stringify(simulated) === JSON.stringify(expectedSimulation);
    });
    test('סבבי המשימות המוטוריות מתארכים בגרסה מלאה ומתקצרים בקצרה', () => {
      const rounds = (key) => T.tasks.get(key).params(3, 5, { age: 5 }).rounds;
      const freeze = T.tasks.get('stompFreeze').params(3, 5, { age: 5 }).trials;
      const march = T.tasks.get('march').params(3, 5, { age: 5 });
      const turtle = T.tasks.get('turtleRabbit').params(3, 5, { age: 5 });
      return freeze.short === 2 && freeze.full === 5
        && rounds('jumps').short === 2 && rounds('jumps').full === 4
        && rounds('clapStomp').short === 4 && rounds('clapStomp').full === 8
        && rounds('ball').short === 3 && rounds('ball').full === 5
        && rounds('elephantMouse').short === 2 && rounds('elephantMouse').full === 4
        && march.count >= 8 && turtle.phaseMs >= 14000;
    });
    test('שלושת פרופילי הסימולציה עומדים במגבלת משימה חדשה וקפיצה', () => {
      const profiles = [
        { id: 'demo-3', age: 3, nonverbal: false, canJump: true, canStand: true },

    function otMockCtx(script, child = { id: 'ot-test', age: 5, gender: 'f' }) {
      let pick = null;
      const said = [];
      const ctx = {
        child, nonverbal: false, G: (m, f) => (child.gender === 'f' ? f : m),
        said, taskBox: () => document.createElement('div'),
        say: async (text) => { said.push(text); otClock.ms += 1000; },
        wait: async () => {}, setManualPick(fn) { pick = fn; },
        listen: async ({ onLive, signal }) => {
          const step = script.shift() || {};
          const t0 = otClock.ms;
          const segments = [], adult = [];
          let lastEnd = null;
          for (const item of step.segments || []) {
            const segment = { start: t0 + item.at, end: t0 + item.at + item.dur, dur: item.dur, hz: item.hz ?? 300, adult: !!item.adult, floorDb: -60, levelDb: -30 };
            lastEnd = Math.max(lastEnd || 0, segment.end);
            if (segment.adult) { adult.push(segment); continue; }
            segments.push(segment);
            onLive && onLive('onset', { t: segment.start });
            onLive && onLive('segment', segment);
            if (signal && signal.cancelled) break;
          }
          otClock.ms = lastEnd !== null ? lastEnd + 300 : t0 + (step.windowMs || 5000);
          if (step.aide && pick) pick(step.aide);
          return { t0, t1: otClock.ms, segments, adult };
        },
      };
      return ctx;
    }
    const otClock = { ms: 0 };
    let otQueue = Promise.all(asyncTests.slice()).catch(() => {});
    function testOt(name, run, frames = []) {
      testAsync(name, () => {
        const next = otQueue.then(async () => {
          const saved = { tombi: T.tombi, ui: T.ui, framesBetween: T.audio.framesBetween, now: T.audio.now };
          T.tombi = { chime() {}, happy() {}, stopSpeaking() {} };
          T.ui = { aideFeelings() {}, flash() {} };
          T.audio.framesBetween = () => frames;
          otClock.ms = 10000;
          T.audio.now = () => otClock.ms;
          try { return await run(); } finally {
            T.tombi = saved.tombi; T.ui = saved.ui; T.audio.framesBetween = saved.framesBetween; T.audio.now = saved.now;
          }
        });
        otQueue = next.catch(() => {});
        return next;
      });
    }
    const near = (value, expected, tolerance = 0.05) => Number.isFinite(value) && Math.abs(value - expected) <= tolerance;
    test('מדדי OT: מרווחים, השהיה וסטטיסטיקה גולמית', () => {

      return JSON.stringify(M.intervals([1000, 4000, 6500])) === '[3000,2500]'
        && M.latencyMs(1000, 1450) === 450 && M.latencyMs(1000, 900) === 0 && M.latencyMs(1000, null) === null
        && s.n === 4 && s.mean === 2.5 && s.median === 2.5 && near(s.sd, 1.118, 0.001)
        && M.stats([]).mean === null;
    });
    test('מדד יציבות שקוף: חלק הפריימים סביב החציון בעוצמה ובגובה צליל', () => {

      const wobbly = M.stability(Array.from({ length: 50 }, (_, i) => (i < 30 ? { db: -30, hz: 300 } : { db: -40, hz: 400 })));
      const breath = M.stability(Array.from({ length: 50 }, () => ({ db: -35, hz: 0 })));
      return steady.audio_stability_score === 1 && steady.pitch_stability_score === 1 && steady.amplitude_sd_db === 0

        && breath.voiced_fraction === 0 && breath.pitch_stability_score === null && breath.audio_stability_score === 1;

    testOt('זמן תגובה: קול שכבר נשמע בפתיחת חלון ההקשבה נרשם כ־null ונספר בנפרד', async () => {
